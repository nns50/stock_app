name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the SAME PR when you push again (rapid force-pushes
# pile up otherwise). Never cancel a push to main: the Fly deploy triggers on
# this workflow's success there, so a cancelled main run would skip the deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
