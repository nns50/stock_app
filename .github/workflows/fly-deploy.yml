name: Deploy to Fly.io

# Deploys on every push to main — but only after the CI workflow passes, so a red
# build never ships. Until you add a FLY_API_TOKEN repo secret (Settings → Secrets
# and variables → Actions), the job runs and cleanly skips, so it won't fail.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

# One deploy at a time; let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only when CI succeeded (workflow_run already filters to main).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when no Fly token is configured
        if: env.FLY_API_TOKEN == ''
        run: echo "FLY_API_TOKEN secret not set — skipping deploy. Add it in Settings → Secrets and variables → Actions to enable auto-deploy."
      - uses: actions/checkout@v6
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      # Reads app/region/mounts/VM from fly.toml and releases the image.
      # Fly's REMOTE builder occasionally fails to provision — "Waiting for
      # depot builder... context deadline exceeded" — stalling the deploy for
      # ~10 min and then failing, with nothing of ours built. Try the remote
      # builder first (fast, no local Docker), and fall back to building on THIS
      # runner's own Docker (ubuntu-latest ships with it) when the remote
      # builder is unavailable, so a Fly builder outage can't block deploys.
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: |
          flyctl deploy --remote-only || {
            echo "::warning::Fly remote builder failed — retrying with a local Docker build (--local-only)."
            flyctl deploy --local-only
          }
